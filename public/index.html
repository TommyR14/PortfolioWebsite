<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<!-- NAV -->
<nav>
  <span class="nav-logo" id="nav-logo">Port<span>folio</span></span>
  <ul class="nav-links">
    <li><a href="#skills">Skills</a></li>
    <li><a href="#certifications">Certs</a></li>
    <li><a href="#experience">Experience</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
    <li><a href="/login.html" class="nav-admin-btn" id="admin-link">Admin</a></li>
  </ul>
</nav>

<!-- HERO -->
<section id="hero">
  <div class="hero-inner">
    <div id="hero-avatar-wrap"></div>
    <h1 class="hero-name" id="hero-name">Loading...</h1>
    <p class="hero-title" id="hero-title"></p>
    <p class="hero-bio" id="hero-bio"></p>
    <div class="hero-links" id="hero-links"></div>
  </div>
</section>

<!-- SKILLS -->
<section id="skills">
  <div class="section-inner">
    <p class="section-label">What I Know</p>
    <h2 class="section-title">Skills</h2>
    <div class="skills-grid" id="skills-grid"></div>
  </div>
</section>

<!-- CERTIFICATIONS -->
<section id="certifications" style="background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);">
  <div class="section-inner">
    <p class="section-label">Credentials</p>
    <h2 class="section-title">Certifications</h2>
    <div class="certs-grid" id="certs-grid"></div>
  </div>
</section>

<!-- EXPERIENCE -->
<section id="experience">
  <div class="section-inner">
    <p class="section-label">Where I've Worked</p>
    <h2 class="section-title">Experience</h2>
    <div class="timeline" id="experience-timeline"></div>
  </div>
</section>

<!-- PROJECTS -->
<section id="projects">
  <div class="section-inner">
    <p class="section-label">What I've Built</p>
    <h2 class="section-title">Projects</h2>
    <div class="project-filters" id="project-filters">
      <button class="filter-btn active" data-filter="all">All</button>
    </div>
    <div class="projects-grid" id="projects-grid"></div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="section-inner">
    <p class="section-label">Get In Touch</p>
    <h2 class="section-title">Contact</h2>
    <div class="contact-grid" id="contact-grid"></div>
  </div>
</section>

<footer>
  <p id="footer-text"></p>
</footer>

<script src="/js/main.js"></script>
</body>
</html>
