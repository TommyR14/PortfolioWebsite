<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tommy Reardon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<main class="snap-container">

  <!-- 01 Hero -->
  <section class="snap-section snap-hero" style="--snap-bg: url('/uploads/snap1.png')">
    <div class="snap-scrim snap-scrim--bottom"></div>
    <div class="snap-content">
      <p class="snap-eyebrow">Portfolio — 2026</p>
      <h1 class="snap-display" id="hero-name">Tommy Reardon</h1>
      <p class="snap-role" id="hero-title">Robotics Engineer</p>
      <p class="snap-bio" id="hero-bio"></p>
      <div class="snap-links" id="hero-links"></div>
    </div>
    <div class="snap-scroll-hint" aria-hidden="true">
      <div class="snap-scroll-hint__line"></div>
      <span>Scroll</span>
    </div>
  </section>

  <!-- 02 About -->
  <section class="snap-section snap-about" style="--snap-bg: url('/uploads/snap2.png')">
    <div class="snap-scrim snap-scrim--left"></div>
    <div class="snap-content">
      <p class="snap-eyebrow">About Me</p>
      <h2 class="snap-heading">Building things<br><em>that matter.</em></h2>
      <p class="snap-body" id="about-bio"></p>
      <div class="snap-meta">
        <span>📍 Lebanon, NH</span>
        <span>🎓 WPI — BS Robotics Engineering, May 2026</span>
      </div>
    </div>
  </section>

  <!-- 03 Everything -->
  <section class="snap-section snap-work" style="--snap-bg: url('/uploads/snap3.png')">
    <div class="snap-scrim snap-scrim--bottom"></div>
    <div class="snap-content">
      <p class="snap-eyebrow">Explore</p>
      <h2 class="snap-heading">What I've<br><em>Built & Done</em></h2>
      <div class="snap-nav-grid">
        <a href="/projects.html" class="snap-nav-card" data-preview="projects">
          <span class="snap-nav-icon">🔧</span>
          <span class="snap-nav-label">Projects</span>
          <span class="snap-nav-arrow">→</span>
        </a>
        <a href="/experience.html" class="snap-nav-card" data-preview="experience">
          <span class="snap-nav-icon">💼</span>
          <span class="snap-nav-label">Experience</span>
          <span class="snap-nav-arrow">→</span>
        </a>
        <a href="/skills.html" class="snap-nav-card" data-preview="skills">
          <span class="snap-nav-icon">⚙️</span>
          <span class="snap-nav-label">Skills & Certs</span>
          <span class="snap-nav-arrow">→</span>
        </a>
      </div>
    </div>
  </section>

  <!-- 05 Contact -->
  <section class="snap-section snap-contact" style="--snap-bg: url('/uploads/snap2.png')">
    <div class="snap-scrim snap-scrim--bottom"></div>
    <div class="snap-content">
      <p class="snap-eyebrow">Get In Touch</p>
      <h2 class="snap-heading">Let's build<br><em>something.</em></h2>
      <div id="hero-links-contact" class="snap-links"></div>
    </div>
  </section>

</main>

<!-- DOT NAV -->
<nav class="snap-dot-nav" aria-label="Jump to section">
  <button class="snap-dot active" data-index="0" aria-label="Hero"></button>
  <button class="snap-dot" data-index="1" aria-label="About"></button>
  <button class="snap-dot" data-index="2" aria-label="Explore"></button>
  <button class="snap-dot" data-index="3" aria-label="Contact"></button>
</nav>

<!-- HOVER PREVIEW TOOLTIP -->
<div id="snap-preview" class="snap-preview" aria-hidden="true">
  <div class="snap-preview-inner" id="snap-preview-inner"></div>
</div>

<script src="/js/main.js"></script>
</body>
</html>
